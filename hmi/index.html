<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0d1117">
<title>ESP32 HMI</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0d1117; color: #e6edf3;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden; user-select: none;
  }
  #app { display: flex; flex-direction: column; height: 100%; padding: 10px; }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 4px 10px; font-size: 15px; color: #8b949e;
  }
  #dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%;
         background: #f85149; margin-right: 6px; vertical-align: middle; }
  #dot.on { background: #3fb950; }
  #gauge { width: 100%; flex: 1 1 auto; min-height: 0; display: block; }
  #nums { display: flex; gap: 10px; }
  .card {
    flex: 1; background: #161b22; border: 1px solid #21262d; border-radius: 12px;
    padding: 10px 12px; text-align: center;
  }
  .lbl { font-size: 13px; color: #8b949e; letter-spacing: 1px; }
  .val { font-size: 40px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .val small { font-size: 16px; color: #8b949e; font-weight: 400; }
  .bar { height: 6px; background: #21262d; border-radius: 3px; margin-top: 8px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 50%; background: #2f81f7; border-radius: 3px;
           transition: width .12s linear; }
  #btns { display: flex; gap: 8px; margin-top: 10px; }
  button {
    flex: 1; padding: 14px 6px; font-size: 16px; border-radius: 12px;
    border: 1px solid #30363d; background: #21262d; color: #e6edf3; font-weight: 500;
  }
  button:active { background: #30363d; }
  #row { display: flex; gap: 8px; margin-top: 8px; }
  #cmd { flex: 1; padding: 13px; font-size: 16px; border-radius: 12px;
         border: 1px solid #30363d; background: #0d1117; color: #e6edf3; }
  #send { flex: 0 0 92px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <span><span id="dot"></span><span id="stat">连接中…</span></span>
    <span id="hz">--</span>
  </header>

  <canvas id="gauge"></canvas>

  <div id="nums">
    <div class="card">
      <div class="lbl">PITCH</div>
      <div class="val"><span id="p">0.0</span><small>°</small></div>
      <div class="bar"><i id="pb"></i></div>
    </div>
    <div class="card">
      <div class="lbl">ROLL</div>
      <div class="val"><span id="r">0.0</span><small>°</small></div>
      <div class="bar"><i id="rb"></i></div>
    </div>
  </div>

  <div id="btns">
    <button id="sndBtn" onclick="beepOn()">🔇 声音关</button>
    <button id="modeBtn" onclick="toggleMode()">滚动中</button>
    <button onclick="send('calib')">重新校准</button>
    <button id="stopBtn" onclick="togglePause()">停止</button>
  </div>

  <div id="row">
    <input id="cmd" placeholder="输入指令，回车发送" autocomplete="off">
    <button id="send" onclick="sendInput()">发送</button>
  </div>
</div>

<script>
var cv = document.getElementById('gauge');
var cx = cv.getContext('2d');
var P = 0, R = 0, ok = 0, seq = -1, fails = 0, lastT = 0;
var soundOn = false, actx = null, lastZ = 0;
/* 物理球：bpx/bpy 是归一化位置(-1..1)，bvx/bvy 是速度 */
var modeRoll = true, bpx = 0, bpy = 0, bvx = 0, bvy = 0;
var trail = [], lastTs = 0;

/* ---------- 画布尺寸 ---------- */
function fit() {
  var dpr = window.devicePixelRatio || 1;
  var w = cv.clientWidth, h = cv.clientHeight;
  cv.width = Math.floor(w * dpr);
  cv.height = Math.floor(h * dpr);
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', fit);

/* ---------- 水平仪 ---------- */
function draw(ts) {
  var dt = lastTs ? Math.min((ts - lastTs) / 1000, 0.05) : 0.016;
  lastTs = ts;
  step(dt);

  var w = cv.clientWidth, h = cv.clientHeight;
  var cxp = w / 2, cyp = h / 2;
  var rad = Math.min(w, h) / 2 - 8;
  cx.clearRect(0, 0, w, h);

  // 外圈
  cx.beginPath();
  cx.arc(cxp, cyp, rad, 0, Math.PI * 2);
  cx.strokeStyle = '#21262d';
  cx.lineWidth = Math.max(2, rad * 0.02);
  cx.stroke();

  // 十字准星
  cx.beginPath();
  cx.moveTo(cxp - rad * 0.92, cyp); cx.lineTo(cxp + rad * 0.92, cyp);
  cx.moveTo(cxp, cyp - rad * 0.92); cx.lineTo(cxp, cyp + rad * 0.92);
  cx.strokeStyle = '#30363d';
  cx.lineWidth = 1;
  cx.stroke();

  // 刻度圈：每 10° 一格
  var i;
  for (i = 0; i < 18; i++) {
    var a = i * Math.PI / 9;
    var r1 = rad * 0.86, r2 = rad * 0.94;
    cx.beginPath();
    cx.moveTo(cxp + Math.cos(a) * r1, cyp + Math.sin(a) * r1);
    cx.lineTo(cxp + Math.cos(a) * r2, cyp + Math.sin(a) * r2);
    cx.strokeStyle = (i % 3 === 0) ? '#484f58' : '#21262d';
    cx.stroke();
  }

  // 中心圆
  cx.beginPath();
  cx.arc(cxp, cyp, rad * 0.10, 0, Math.PI * 2);
  cx.strokeStyle = '#30363d';
  cx.stroke();

  // 气泡：pitch 控制上下，roll 控制左右，满量程 ±30°
  var bx = cxp + bpx * rad * 0.78;
  var by = cyp + bpy * rad * 0.78;
  var over = (Math.abs(P) > 25 || Math.abs(R) > 25);
  var col = over ? '#f85149' : '#3fb950';

  // 拖尾：速度越快，尾巴越长越淡
  var i;
  for (i = 0; i < trail.length; i++) {
    var k = (i + 1) / (trail.length + 1);
    cx.beginPath();
    cx.arc(cxp + trail[i].x * rad * 0.78, cyp + trail[i].y * rad * 0.78,
           rad * 0.10 * (0.35 + 0.5 * k), 0, Math.PI * 2);
    cx.fillStyle = col;
    cx.globalAlpha = 0.05 + 0.16 * k;
    cx.fill();
  }
  cx.globalAlpha = 1;

  cx.beginPath();
  cx.arc(bx, by, rad * 0.10, 0, Math.PI * 2);
  cx.fillStyle = col;
  cx.globalAlpha = 0.9;
  cx.fill();
  cx.globalAlpha = 1;

  requestAnimationFrame(draw);
}

/* ---------- 轮询 ---------- */
function poll() {
  var x = new XMLHttpRequest();
  x.open('GET', '/api?t=' + (new Date().getTime()), true);
  x.timeout = 2500;
  x.onload = function () {
    try {
      var d = JSON.parse(x.responseText);
      P = d.p; R = d.r; ok = d.ok; lastZ = d.z || 0;
      fails = 0;
      document.getElementById('dot').className = 'on';
      document.getElementById('stat').textContent = (lastZ ? '已暂停' : (ok ? '在线' : '在线 · 无传感器'));
      document.getElementById('p').textContent = d.p.toFixed(1);
      document.getElementById('r').textContent = d.r.toFixed(1);
      document.getElementById('pb').style.width = clamp(50 + d.p * 1.6) + '%';
      document.getElementById('rb').style.width = clamp(50 + d.r * 1.6) + '%';
      document.getElementById('pb').style.background = over(d.p) ? '#f85149' : '#2f81f7';
      document.getElementById('rb').style.background = over(d.r) ? '#f85149' : '#2f81f7';
      document.getElementById('hz').textContent = 'n=' + d.n + (d.e ? ' e=' + d.e : '');
      if (soundOn && (over(d.p) || over(d.r))) beep(880);
    } catch (e) { onFail(); }
  };
  x.onerror = x.ontimeout = onFail;
  x.send();
}

function over(v) { return Math.abs(v) > 25; }
function clamp(v) { return Math.max(0, Math.min(100, v)); }
function onFail() {
  fails++;
  if (fails >= 3) {
    document.getElementById('dot').className = '';
    document.getElementById('stat').textContent = '断开';
  }
}
setInterval(poll, 200);

/* ---------- 声音 ---------- */
function beepOn() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (actx && actx.state === 'suspended') actx.resume();
  soundOn = !soundOn;
  var b = document.getElementById('sndBtn');
  b.textContent = soundOn ? '🔊 声音开' : '🔇 声音关';
  b.style.background = soundOn ? '#1f6feb' : '#21262d';
  b.style.borderColor = soundOn ? '#2f81f7' : '#30363d';
  if (soundOn && actx) beep(1200);
  document.activeElement.blur();
}
var lastBeep = 0;
function beep(f) {
  if (!actx) return;
  var t = new Date().getTime();
  if (t - lastBeep < 600) return;
  lastBeep = t;
  var o = actx.createOscillator(), g = actx.createGain();
  o.type = 'sine'; o.frequency.value = f;
  g.gain.setValueAtTime(0.25, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.15);
  o.connect(g); g.connect(actx.destination);
  o.start(); o.stop(actx.currentTime + 0.15);
}

/* ---------- 下行指令 ---------- */
/* ---------- 物理球 ---------- */
function step(dt) {
  if (!modeRoll) {           // 指示模式：位置 = 角度
    bpx = Math.max(-0.85, Math.min(0.85, R / 30));
    bpy = Math.max(-0.85, Math.min(0.85, P / 30));
    bvx = bvy = 0;
    trail.length = 0;
    return;
  }
  // 倾角 → 加速度；回中弹簧 → 水平时归位；阻尼 → 有摩擦感
  var ax = (R / 30) * 3.2 - bpx * 3.4 - bvx * 1.2;
  var ay = (P / 30) * 3.2 - bpy * 3.4 - bvy * 1.2;
  bvx += ax * dt;
  bvy += ay * dt;
  bpx += bvx * dt;
  bpy += bvy * dt;

  var L = 0.86;
  if (bpx > L) { bpx = L; bvx = -bvx * 0.35; }
  if (bpx < -L) { bpx = -L; bvx = -bvx * 0.35; }
  if (bpy > L) { bpy = L; bvy = -bvy * 0.35; }
  if (bpy < -L) { bpy = -L; bvy = -bvy * 0.35; }

  trail.push({ x: bpx, y: bpy });
  if (trail.length > 7) trail.shift();
}

function toggleMode() {
  modeRoll = !modeRoll;
  var b = document.getElementById('modeBtn');
  b.textContent = modeRoll ? '滚动中' : '指示中';
  b.style.background = modeRoll ? '#1f6feb' : '#21262d';
  b.style.borderColor = modeRoll ? '#2f81f7' : '#30363d';
  if (!modeRoll) { bpx = bpy = bvx = bvy = 0; trail.length = 0; }
}

function togglePause() {
  var b = document.getElementById('stopBtn');
  if (lastZ) { send('start'); b.textContent = '停止'; lastZ = 0; }
  else { send('stop'); b.textContent = '继续'; lastZ = 1; }
}
function send(v) {
  var x = new XMLHttpRequest();
  x.open('GET', '/cmd?x=' + encodeURIComponent(v), true);
  x.send();
}
function sendInput() {
  var el = document.getElementById('cmd');
  var v = el.value.trim();
  if (v) { send(v); el.value = ''; el.blur(); }
}

/* ---------- 启动 ---------- */
fit();
draw();
poll();
</script>
</body>
</html>
